# Include inside the HTTPS server block for cms.wonlyglobal.com.
# The trailing slash on proxy_pass intentionally removes the public /api/<name>/ prefix.

location /api/admin/ {
    proxy_pass http://127.0.0.1:8789/;
    include proxy_params;
    proxy_read_timeout 30s;
}

location /api/analytics/ {
    proxy_pass http://127.0.0.1:8790/;
    include proxy_params;
    proxy_read_timeout 90s;
}

location /api/health/ {
    proxy_pass http://127.0.0.1:8791/;
    include proxy_params;
    proxy_read_timeout 30s;
}

location /api/backup/ {
    proxy_pass http://127.0.0.1:8792/;
    include proxy_params;
    proxy_read_timeout 900s;
    client_max_body_size 16k;
}

location /api/ai/ {
    proxy_pass http://127.0.0.1:8793/;
    include proxy_params;
    proxy_read_timeout 120s;
    client_max_body_size 16k;
}

location /api/quality/ {
    proxy_pass http://127.0.0.1:8794/;
    include proxy_params;
    proxy_read_timeout 120s;
    client_max_body_size 16k;
}

location /api/deploy/ {
    proxy_pass http://127.0.0.1:8795/;
    include proxy_params;
    proxy_read_timeout 180s;
    client_max_body_size 16k;
}
