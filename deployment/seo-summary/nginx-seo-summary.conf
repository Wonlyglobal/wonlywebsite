# Review template only. Include inside the TLS server block for
# seo-api.wonlyglobal.com after separate DNS/TLS/deployment approval.

location = /seo-summary/v1/current {
    limit_except GET { deny all; }
    proxy_pass http://127.0.0.1:8796;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-Proto https;
    proxy_pass_request_headers on;
    proxy_read_timeout 15s;
    client_max_body_size 1k;
}

location = /seo-summary/v1/history {
    limit_except GET { deny all; }
    proxy_pass http://127.0.0.1:8796;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-Proto https;
    proxy_pass_request_headers on;
    proxy_read_timeout 15s;
    client_max_body_size 1k;
}
