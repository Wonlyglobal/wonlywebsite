limit_req_zone $binary_remote_addr zone=wonly_seo_summary:10m rate=30r/m;

server {
    listen 80;
    listen [::]:80;
    server_name seo-api.wonlyglobal.com;
    location ^~ /.well-known/acme-challenge/ {
        root /var/www/letsencrypt;
        default_type text/plain;
    }
    location / { return 301 https://$host$request_uri; }
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name seo-api.wonlyglobal.com;
    ssl_certificate /etc/letsencrypt/live/seo-api.wonlyglobal.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/seo-api.wonlyglobal.com/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_cache shared:WONLY_SEO_SSL:10m;
    ssl_session_timeout 1d;
    access_log /var/log/nginx/seo-api.access.log;
    error_log /var/log/nginx/seo-api.error.log warn;
    server_tokens off;

    location = /seo-summary/v1/current {
        limit_req zone=wonly_seo_summary burst=10 nodelay;
        limit_except GET { deny all; }
        proxy_pass http://127.0.0.1:8796;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto https;
        proxy_pass_request_headers on;
        proxy_read_timeout 15s;
        client_max_body_size 1k;
    }

    location = /seo-summary/v1/history {
        limit_req zone=wonly_seo_summary burst=10 nodelay;
        limit_except GET { deny all; }
        proxy_pass http://127.0.0.1:8796;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto https;
        proxy_pass_request_headers on;
        proxy_read_timeout 15s;
        client_max_body_size 1k;
    }

    location / { return 404; }
}
