server {
    listen 8080;
    listen [::]:8080;
    server_name _;
    absolute_redirect off;

    root /usr/share/nginx/html/dist;
    index index.html;

    location = /healthz {
        access_log off;
        default_type text/plain;
        add_header Cache-Control "no-store";
        return 200 "ok\n";
    }

    location /assets/ {
        try_files $uri =404;
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    location ~* \.html$ {
        add_header Cache-Control "no-cache";
    }

    # Support direct access to multilingual SPA routes such as /ar/, /fr/, /ru/ and /es/.
    location / {
        # Prefer prerendered route HTML before treating a matching path as a
        # directory. This keeps canonical, slashless article URLs on HTTPS
        # instead of letting Nginx expose the internal :8080 listener in a 301.
        try_files $uri/index.html $uri /index.html;
    }
}
