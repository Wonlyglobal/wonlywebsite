name: Deploy to GitHub Pages (manual legacy)

on:
  workflow_dispatch:

# Allow the workflow to publish to GitHub Pages
permissions:
  contents: read
  pages: write
  id-token: write

# One deploy at a time; don't cancel an in-progress production deploy
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      # Inject <url> entries into public/sitemap.xml for every article whose
      # publish date has arrived (idempotent; runs before build so prerender
      # picks the routes up). Future-dated articles stay out until their date.
      - name: Sync scheduled articles into sitemap
        run: node scripts/sync-article-sitemap.mjs

      - name: Check multilingual coverage and hreflang
        run: node scripts/check-i18n.mjs

      - name: Build
        # Production build. VITE_BASE defaults to "/" (custom domain at root).
        # For a project page at https://<user>.github.io/<repo>/, set a repo
        # variable VITE_BASE to /<repo>/. The SPA deep-link 404 fallback
        # (dist/404.html) is generated by the postbuild step in package.json.
        env:
          VITE_BASE: ${{ vars.VITE_BASE || '/' }}
        run: npm run build

      # Prerender each canonical route to a real static HTML file so GitHub
      # Pages returns 200 (not 404) for deep links and crawlers see per-page
      # <title>/<meta>/content. Playwright is installed here only (kept out of
      # package.json so npm ci + the lockfile stay untouched for the build).
      - name: Install Playwright (prerender)
        run: |
          npm i -D --no-save playwright@^1.48
          npx playwright install --with-deps chromium

      - name: Prerender routes to static HTML (SEO)
        run: node scripts/prerender.mjs

      - name: Audit prerendered multilingual HTML
        run: node scripts/audit-prerender.mjs

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

      # 构建失败 → 立即告警到飞书工作群(复用日报 webhook)。没有这一步,
      # 构建红了线上会一直停在旧版而无人知晓(2026-08-04 已发生过一次)。
      - name: Notify Feishu on failure
        if: failure()
        env:
          HOOK: ${{ secrets.FEISHU_WORK_WEBHOOK }}
        run: |
          [ -n "$HOOK" ] && curl -s -m 10 -X POST "$HOOK" -H 'Content-Type: application/json' \
            -d "{\"msg_type\":\"text\",\"content\":{\"text\":\"【官网告警】构建/部署失败:${GITHUB_WORKFLOW} #${GITHUB_RUN_NUMBER}(commit ${GITHUB_SHA:0:7})。线上仍是旧版本,请尽快处理:https://github.com/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}\"}}" || true

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

      # 构建失败 → 立即告警到飞书工作群(复用日报 webhook)。没有这一步,
      # 构建红了线上会一直停在旧版而无人知晓(2026-08-04 已发生过一次)。
      - name: Notify Feishu on failure
        if: failure()
        env:
          HOOK: ${{ secrets.FEISHU_WORK_WEBHOOK }}
        run: |
          [ -n "$HOOK" ] && curl -s -m 10 -X POST "$HOOK" -H 'Content-Type: application/json' \
            -d "{\"msg_type\":\"text\",\"content\":{\"text\":\"【官网告警】构建/部署失败:${GITHUB_WORKFLOW} #${GITHUB_RUN_NUMBER}(commit ${GITHUB_SHA:0:7})。线上仍是旧版本,请尽快处理:https://github.com/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}\"}}" || true
