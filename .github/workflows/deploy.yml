name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

# Allow the workflow to publish to GitHub Pages
permissions:
  contents: read
  pages: write
  id-token: write

# One deploy at a time; don't cancel an in-progress production deploy
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build
        # Production build. VITE_BASE defaults to "/" (custom domain at root).
        # For a project page at https://<user>.github.io/<repo>/, set a repo
        # variable VITE_BASE to /<repo>/. The SPA deep-link 404 fallback
        # (dist/404.html) is generated by the postbuild step in package.json.
        env:
          VITE_BASE: ${{ vars.VITE_BASE || '/' }}
        run: npm run build

      # Prerender each canonical route to a real static HTML file so GitHub
      # Pages returns 200 (not 404) for deep links and crawlers see per-page
      # <title>/<meta>/content. Playwright is installed here only (kept out of
      # package.json so npm ci + the lockfile stay untouched for the build).
      - name: Install Playwright (prerender)
        run: |
          npm i -D --no-save playwright@^1.48
          npx playwright install --with-deps chromium

      - name: Prerender routes to static HTML (SEO)
        run: node scripts/prerender.mjs

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
