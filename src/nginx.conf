server {
    listen 8080;
    listen [::]:8080;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    location = /healthz {
        access_log off;
        default_type text/plain;
        add_header Cache-Control "no-store";
        return 200 "ok\n";
    }

    # Immutable Vite assets use content hashes in their filenames.
    location /assets/ {
        try_files $uri =404;
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # HTML must be revalidated so releases take effect promptly.
    location ~* \.html$ {
        add_header Cache-Control "no-cache";
    }

    # Static assets are fetched directly; all application routes fall back to the SPA.
    location / {
        try_files $uri $uri/ /index.html;
