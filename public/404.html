<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>WONLY</title>
    <!--
      spa-github-pages redirect (rafgraph/spa-github-pages).
      GitHub Pages serves this 404.html for any unknown path. It encodes the
      requested path into a query string and bounces to index.html, where a
      companion snippet decodes it back so BrowserRouter can render the route.

      pathSegmentsToKeep = 0  -> custom domain or user/org root page (this deploy)
      pathSegmentsToKeep = 1  -> project page served under /<repo>/
    -->
    <script type="text/javascript">
      var pathSegmentsToKeep = 0;
      var l = window.location;
      l.replace(
        l.protocol + '//' + l.hostname + (l.port ? ':' + l.port : '') +
        l.pathname.split('/').slice(0, 1 + pathSegmentsToKeep).join('/') + '/?/' +
        l.pathname.slice(1).split('/').slice(pathSegmentsToKeep).join('/').replace(/&/g, '~and~') +
        (l.search ? '&' + l.search.slice(1).replace(/&/g, '~and~') : '') +
        l.hash
      );
    </script>
  </head>
  <body></body>
</html>
