# WONLY 站点后台配置(Sveltia/Decap CMS)— 完整版:站点设置 + 页面文案 + 文章
backend:
  name: github
  repo: Wonlyglobal/wonlywebsite
  branch: main

site_url: https://www.wonlyglobal.com
display_url: https://www.wonlyglobal.com
logo_url: https://www.wonlyglobal.com/images/logo-trim.webp

# 图库 = 整个 public/images 目录:封面图可直接从现有官网图片里选,也可上传新图
media_folder: "public/images"
public_folder: "images"

slug:
  encoding: ascii
  clean_accents: true

collections:
  - name: settings
    label: "站点设置"
    files:
      - name: navigation
        label: "导航栏 & 页脚"
        file: "content/settings/navigation.json"
        format: "json"
        fields:
          - name: nav
            label: "顶部导航(增删/排序/改名)"
            widget: list
            fields:
              - { name: label, label: "显示名", widget: string }
              - { name: href, label: "链接(留空=仅作分组标题)", widget: string, required: false, default: "" }
              - name: children
                label: "下拉子项"
                widget: list
                required: false
                fields:
                  - { name: label, label: "显示名", widget: string }
                  - { name: href, label: "链接", widget: string, required: false, default: "" }
                  - { name: img, label: "缩略图(相对 images/,可留空)", widget: string, required: false, default: "" }
                  - name: children
                    label: "三级子项"
                    widget: list
                    required: false
                    fields:
                      - { name: label, label: "显示名", widget: string }
                      - { name: href, label: "链接", widget: string, required: false, default: "" }
                      - { name: img, label: "缩略图(可留空)", widget: string, required: false, default: "" }
          - name: footer
            label: "页脚栏目"
            widget: list
            fields:
              - { name: h, label: "栏目标题", widget: string }
              - name: links
                label: "链接列表"
                widget: list
                fields:
                  - { name: l, label: "显示文本", widget: string }
                  - { name: href, label: "链接(mailto:/https:/站内路径均可)", widget: string, required: false, default: "" }
      - name: tdk
        label: "SEO TDK(标题/描述/关键词)"
        file: "content/settings/tdk.json"
        format: "json"
        fields:
          - name: pages
            label: "各页面 TDK(已预填当前线上值,直接微调即可)"
            widget: list
            fields:
              - { name: path, label: "页面路径", widget: string, hint: "如 / 或 /products/security-doors,勿改" }
              - { name: title, label: "Title(建议 ≤60 字符,含 | WONLY)", widget: string, required: false, default: "" }
              - { name: description, label: "Description(建议 ≤155 字符)", widget: text, required: false, default: "" }
              - { name: keywords, label: "Keywords(英文逗号分隔,可留空)", widget: string, required: false, default: "" }
      - name: site
        label: "站点通用(图标/客服/表单收件)"
        file: "content/settings/site.json"
        format: "json"
        fields:
          - { name: favicon, label: "浏览器标签页图标(从图库选择或上传,建议 256×256 PNG;留空=用默认)", widget: image, required: false, default: "" }
          - { name: whatsapp, label: "WhatsApp 悬浮按钮号码(留空=不显示按钮)", widget: string, required: false, default: "", hint: "如 +1 (205) 240-1832" }
          - { name: whatsappLabel, label: "WhatsApp 按钮悬停文字", widget: string, required: false, default: "Chat on WhatsApp" }
          - { name: crispId, label: "Crisp 在线聊天 Website ID(推荐;留空=不加载)", widget: string, required: false, default: "", hint: "crisp.chat 注册后在 Settings → Website Settings 里复制 Website ID(一串 UUID)" }
          - { name: tawkId, label: "Tawk.to 在线聊天 ID(留空=不加载聊天窗)", widget: string, required: false, default: "", hint: "注册 tawk.to 后取 Direct Chat Link 里的两段 ID,格式 propertyId/widgetId" }
          - { name: formKey, label: "询盘表单收件 Access Key(决定表单发到哪个邮箱)", widget: string, required: false, default: "", hint: "在 web3forms.com 用 inquiry@wonlyglobal.com 免费领取 Access Key,粘贴到这里即可换收件邮箱;留空=沿用原邮箱" }
          - { name: formCc, label: "询盘抄送邮箱(可留空,多个用英文逗号分隔)", widget: string, required: false, default: "", hint: "部分 Web3Forms 套餐才支持抄送;不确定就先留空" }
      - name: homepage
        label: "首页 首屏文案"
        file: "content/settings/homepage.json"
        format: "json"
        fields:
          - name: hero
            label: "开门前(黑色大门画面)"
            widget: object
            fields:
              - { name: eyebrow, label: "顶部小字(香槟金)", widget: string }
              - { name: line1, label: "大标题 · 第一行", widget: string }
              - { name: line2, label: "大标题 · 第二行", widget: string }
              - { name: line3, label: "大标题 · 第三行(金色)", widget: string }
              - { name: subtitle, label: "副标题", widget: text }
              - { name: scrollLabel, label: "底部滚动提示", widget: string }
          - name: reveal
            label: "开门后(数据展示画面)"
            widget: object
            fields:
              - { name: line1, label: "标题 · 第一行", widget: string }
              - { name: line2, label: "标题 · 第二行", widget: string }
      - name: contact
        label: "联系页 信息"
        file: "content/settings/contact.json"
        format: "json"
        fields:
          - name: hero
            label: "页首"
            widget: object
            fields:
              - { name: eyebrow, label: "顶部小字", widget: string }
              - { name: title, label: "大标题(常规部分)", widget: string }
              - { name: titleHighlight, label: "大标题(金色部分)", widget: string }
              - { name: subtitle, label: "副标题", widget: text }
          - { name: email, label: "联系邮箱", widget: string }
          - { name: emailNote, label: "邮箱说明文字", widget: string }
          - { name: whatsapp, label: "WhatsApp 显示号码", widget: string }
          - { name: whatsappLink, label: "WhatsApp 链接(https://wa.me/…)", widget: string }
          - { name: whatsappNote, label: "WhatsApp 说明文字", widget: string }
          - { name: hqTitle, label: "总部所在地", widget: string }
          - { name: hqNote, label: "总部说明(如 WONLY · SSE: 605268)", widget: string }
          - { name: prevSiteLabel, label: "旧官网显示文本", widget: string }
          - { name: prevSiteUrl, label: "旧官网链接", widget: string }
          - { name: prevSiteNote, label: "旧官网说明文字", widget: string }
          - { name: regionsBold, label: "重点区域 · 加粗前缀", widget: string }
          - { name: regionsLine1, label: "重点区域 · 第一行", widget: string }
          - { name: regionsLine2, label: "重点区域 · 第二行", widget: string }
  - name: articles
    label: "News & Insights 文章"
    label_singular: "文章"
    folder: "content/articles"
    extension: "md"
    format: "frontmatter"
    create: true
    slug: "{{slug}}"
    identifier_field: slug
    summary: "{{date}} · {{title}}"
    sortable_fields: [date, title]
    view_groups:
      - { label: "按分类", field: category }
    fields:
      - { name: slug, label: "URL Slug(英文短横线,创建后勿改)", widget: string, hint: "如 security-doors-for-hotels" }
      - { name: title, label: "标题 Title", widget: string }
      - { name: seoTitle, label: "SEO 标题(≤60字符,含 | WONLY)", widget: string }
      - { name: description, label: "Meta 描述(≤155字符)", widget: text }
      - { name: category, label: "分类", widget: select, options: ["Buying Guide", "Technology", "Market Insight", "Company"] }
      - { name: date, label: "发布日期(填未来日期=定时发布)", widget: string, pattern: ['^\d{4}-\d{2}-\d{2}$', "日期格式须为 YYYY-MM-DD,如 2026-08-20"], hint: "到期当天上午 09:23 自动上线" }
      - { name: dateLabel, label: "日期显示文本(英文)", widget: string, hint: "如 5 August 2026" }
      - { name: readMins, label: "阅读分钟数", widget: number, default: 6, value_type: int }
      - { name: cover, label: "封面图(点击从图库选择或上传)", widget: image, hint: "旧文章存的是相对路径(如 door/gallery/g1-front.jpg),两种格式都能正常显示" }
      - { name: excerpt, label: "列表页摘要", widget: text }
      - { name: keywords, label: "SEO 关键词(每行一个)", widget: list }
      - name: body
        label: "正文(## 二级标题;- 列表;空行分段)"
        widget: markdown
        default: |
          Opening paragraph — state the buyer question this article answers and why WONLY is qualified to answer it.

          ## First Key Point

          Explain the first point in two or three sentences, with concrete numbers or certifications where possible.

          - Supporting detail one
          - Supporting detail two
          - Supporting detail three

          ## Second Key Point

          Develop the second point. Reference standards (EN 1627, EN 1634, GB 17565) or WONLY capabilities (5 bases, 1,000+ patents) where relevant.

          ## What This Means for Buyers

          Close with a practical takeaway and a call to action: contact inquiry@wonlyglobal.com for specifications, compliance documents and pricing.
