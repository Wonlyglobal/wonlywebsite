    <!-- spa-github-pages: decode a path bounced here by 404.html back into the URL
         so BrowserRouter can render deep links on GitHub Pages. Must run before the app. -->
    <script type="text/javascript">
      (function (l) {
        if (l.search[1] === '/') {
          var decoded = l.search.slice(1).split('&').map(function (s) {
            return s.replace(/~and~/g, '&');
          }).join('?');
          window.history.replaceState(null, null, l.pathname.slice(0, -1) + decoded + l.hash);
        }
      }(window.location));
    </script>

    <!-- Paint the poster immediately and warm the stable animated WebP before React mounts.
         Coarse/mobile devices keep the lightweight still-image path. -->
    <script>
      if (location.pathname === "/") {
        var p = document.createElement("link"); p.rel = "preload"; p.as = "image"; p.href = "/videos/hero-door-poster.webp"; document.head.appendChild(p);
        var o = document.createElement("link"); o.rel = "preload"; o.as = "image"; o.href = "/images/interior-bg.jpg"; document.head.appendChild(o);
        window.__wonlyLoadDoorAnimation = function () {
          if (!window.__wonlyDoorAnimationBlob) {
            window.__wonlyDoorAnimationBlob = fetch("/videos/hero-door-open.webp", { cache: "force-cache" }).then(function (response) {
              if (!response.ok) throw new Error("Door animation failed: " + response.status);
              return response.blob();
            });
          }
          return window.__wonlyDoorAnimationBlob;
        };
        if (matchMedia("(min-width: 768px) and (pointer: fine)").matches) window.__wonlyLoadDoorAnimation();
      }
    </script>
    <!-- Preserve an intro gesture made before the React bundle has mounted. -->
    <script>
      if (location.pathname === "/" && !location.hash) {
        window.__wonlyEarlyIntroIntent = false;
        window.__wonlyEarlyIntroMark = function (event) {
          if (!event || event.type !== "keydown" || ["ArrowDown", "PageDown", " "].indexOf(event.key) !== -1) {
            window.__wonlyEarlyIntroIntent = true;
            if (window.__wonlyLoadDoorAnimation && matchMedia("(min-width: 768px) and (pointer: fine)").matches) window.__wonlyLoadDoorAnimation();
          }
        };
        document.addEventListener("wheel", window.__wonlyEarlyIntroMark, { capture: true, passive: true });
        document.addEventListener("touchstart", window.__wonlyEarlyIntroMark, { capture: true, passive: true });
        window.addEventListener("keydown", window.__wonlyEarlyIntroMark, true);
        window.__wonlyEarlyIntroCleanup = function () {
          document.removeEventListener("wheel", window.__wonlyEarlyIntroMark, true);
          document.removeEventListener("touchstart", window.__wonlyEarlyIntroMark, true);
          window.removeEventListener("keydown", window.__wonlyEarlyIntroMark, true);
        };
      }
    </script>
